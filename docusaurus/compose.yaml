services:
  docusaurus:
    # Build locally, push to registry:
    #   docker compose build
    #   docker push forgejo.example.familyds.net/example/docusaurus:latest
    image: forgejo.example.familyds.net/example/docusaurus:20260420-134536
    container_name: docusaurus
    restart: unless-stopped
    dns:
      - ${DNS_IP:-172.31.2.1}
      - 1.1.1.1
    extra_hosts:
      - "forgejo.example.familyds.net:${NAS_IP:-172.31.2.12}"
    environment:
      - TZ=${TZ:-Europe/Prague}
    volumes:
      # Persists cloned repos across restarts; populated by entrypoint.sh
      - docusaurus-data:/data
    networks:
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.docusaurus.rule=Host(`docs.${LOCAL_DOMAIN}`)"
      - "traefik.http.routers.docusaurus.entrypoints=web"
      - "traefik.http.services.docusaurus.loadbalancer.server.port=80"
      # Homepage auto-discovery
      - "homepage.group=Applications"
      - "homepage.name=Docs"
      - "homepage.icon=docusaurus"
      - "homepage.href=https://docs.${LOCAL_DOMAIN}"
      - "homepage.description=Internal documentation and knowledge base"

volumes:
  docusaurus-data:

networks:
  traefik_proxy:
    external: true
