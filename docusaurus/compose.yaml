services:
  docusaurus:
    # Build the image directly on the Synology NAS on-the-fly!
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docusaurus
    restart: unless-stopped
    dns:
      - ${DNS_IP:-172.31.2.1}
      - 1.1.1.1
    extra_hosts:
      - "forgejo.${LOCAL_DOMAIN}:${NAS_IP:-172.31.2.12}"
    environment:
      - TZ=${TZ:-Europe/Prague}
    volumes:
      # Persists cloned repos across restarts; populated by entrypoint.sh
      - docusaurus-data:/data
      # Optional: Bind-mount local directories containing your guides (safe fallbacks if empty)
      - ${LOCAL_DOCS_PATH:-docusaurus-empty}:/app/docs/dokumentace
      - ${LOCAL_DOCS_PATH_2:-docusaurus-empty}:/app/docs/dokumentace_2
      - ${LOCAL_DOCS_PATH_3:-docusaurus-empty}:/app/docs/dokumentace_3
    networks:
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.docusaurus.rule=Host(`docs.${LOCAL_DOMAIN}`)"
      - "traefik.http.routers.docusaurus.entrypoints=web"
      - "traefik.http.services.docusaurus.loadbalancer.server.port=80"
      # Homepage auto-discovery
      - "homepage.group=Applications"
      - "homepage.name=Docs"
      - "homepage.icon=docusaurus"
      - "homepage.href=https://docs.${LOCAL_DOMAIN}"
      - "homepage.description=Internal documentation and knowledge base"

volumes:
  docusaurus-data:
  docusaurus-empty:

networks:
  traefik_proxy:
    external: true
