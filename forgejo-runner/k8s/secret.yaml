# Create with:
#   kubectl -n forgejo-runner create secret generic forgejo-runner \
#     --from-literal=RUNNER_TOKEN=<token>
#
# Or apply this template after base64-encoding the token:
#   echo -n '<token>' | base64
apiVersion: v1
kind: Secret
metadata:
  name: forgejo-runner
  namespace: forgejo-runner
type: Opaque
data:
  RUNNER_TOKEN: ""  # base64-encoded registration token
