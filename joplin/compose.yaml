services:
  joplin:
    # renovate: datasource=docker depName=joplin/server
    image: joplin/server:3.5.2
    container_name: joplin
    restart: unless-stopped
    depends_on:
      joplin-db:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      - APP_BASE_URL=https://joplin.${LOCAL_DOMAIN}
      - APP_PORT=22300
      - DB_CLIENT=pg
      - POSTGRES_HOST=joplin-db
      - POSTGRES_PORT=5432
      - POSTGRES_DATABASE=${POSTGRES_DATABASE}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      # First-start only — ignored if database already exists
      - APP_ADMIN_EMAIL=${APP_ADMIN_EMAIL}
      - APP_ADMIN_PASSWORD=${APP_ADMIN_PASSWORD}
      # SMTP (non-secrets from .env via config.env, password from Dockhand)
      - MAILER_ENABLED=1
      - MAILER_HOST=${MAILER_HOST}
      - MAILER_PORT=${MAILER_PORT}
      - MAILER_SECURITY=starttls
      - MAILER_AUTH_USER=${MAILER_AUTH_USER}
      - MAILER_AUTH_PASSWORD=${MAILER_AUTH_PASSWORD}
      - MAILER_NOREPLY_NAME=Joplin
      - MAILER_NOREPLY_EMAIL=${MAILER_NOREPLY_EMAIL}
    networks:
      - traefik_proxy
      - joplin_internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.joplin.rule=Host(`joplin.${LOCAL_DOMAIN}`)"
      - "traefik.http.routers.joplin.entrypoints=web"
      - "traefik.http.services.joplin.loadbalancer.server.port=22300"
      # Homepage
      - "homepage.group=Applications"
      - "homepage.name=Joplin"
      - "homepage.icon=joplin"
      - "homepage.href=https://joplin.${LOCAL_DOMAIN}"
      - "homepage.description=Note sync server"

  joplin-db:
    # renovate: datasource=docker depName=postgres
    image: postgres:16-alpine
    container_name: joplin-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DATABASE}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - joplin-db-data:/var/lib/postgresql/data
    networks:
      - joplin_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  joplin-db-data:

networks:
  traefik_proxy:
    external: true
  joplin_internal:
    driver: bridge
