services:
  renovate:
    # renovate: datasource=docker depName=renovate/renovate
    image: renovate/renovate:39
    container_name: renovate
    restart: "no"
    env_file:
      - .env
    environment:
      - RENOVATE_PLATFORM=gitea
      - RENOVATE_ENDPOINT=${GITEA_URL}
      - RENOVATE_TOKEN=${RENOVATE_TOKEN}
      - RENOVATE_REPOSITORIES=${RENOVATE_REPOSITORIES:-admin/home}
      - RENOVATE_ONBOARDING_CONFIG_FILE_NAME=services/renovate.json
      - RENOVATE_REQUIRE_CONFIG=optional
      - RENOVATE_GIT_AUTHOR=${RENOVATE_GIT_AUTHOR:-Renovate Bot <renovate@localhost>}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - renovate-cache:/tmp/renovate/cache

volumes:
  renovate-cache:
